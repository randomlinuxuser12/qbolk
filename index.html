<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قبولك - معدلات القبول الجامعي</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🎓 قبولك</div>
    <p>دليل الحدود الدنيا للقبول المركزي 2025-2026</p>
</header>

<main>

    <section class="hero">
        <h1>اعرف الأقسام التي يقبلك بها معدلك</h1>
        <p>أدخل معدلك واختر الفرع والجنس لمعرفة خياراتك.</p>
    </section>

    <section class="search-box">

        <div class="field">
            <label>معدلك</label>
            <input
                id="grade"
                type="number"
                min="0"
                max="100"
                step="0.01"
                placeholder="مثال: 95">
        </div>

        <div class="field">
            <label>الفرع</label>

            <select id="branch">
                <option value="">اختر الفرع</option>
                <option value="علمي">علمي</option>
                <option value="أدبي">أدبي</option>
                <option value="أحيائي">أحيائي</option>
                <option value="تطبيقي">تطبيقي</option>
                <option value="فنون">فنون</option>
            </select>
        </div>

        <div class="field">
            <label>الجنس</label>

            <select id="gender">
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
        </div>

        <button onclick="search()">
            🔍 أظهر الأقسام
        </button>

    </section>

    <section id="summary" class="summary hidden"></section>

    <section id="results"></section>

</main>

<footer>
    © 2026 قبولك
</footer>

<script src="data.js"></script>

<script>

function normalize(value) {

    return String(value)
        .replace(/[٠-٩]/g, d =>
            "٠١٢٣٤٥٦٧٨٩".indexOf(d)
        )
        .trim();
}


function search() {

    const grade =
        Number(document.getElementById("grade").value);

    const branch =
        document.getElementById("branch").value;

    const gender =
        document.getElementById("gender").value;

    const results =
        document.getElementById("results");

    const summary =
        document.getElementById("summary");


    if (
        Number.isNaN(grade) ||
        grade < 0 ||
        grade > 100
    ) {
        alert("أدخل معدل صحيح بين 0 و100");
        return;
    }


    if (!branch) {
        alert("اختر الفرع الدراسي");
        return;
    }


    /*
       مهم:

       المعدل الطالب >= الحد الأدنى
       يعني القسم متاح له.
    */

    let matches = admissionData.filter(item => {

        const gradeOK =
            grade >= Number(item.minimum);

        const branchOK =
            normalize(item.branch) === normalize(branch);

        /*
           المختلط متاح للذكر والأنثى
        */

        const genderOK =
            item.gender === "مختلط" ||
            item.gender === gender;

        return gradeOK && branchOK && genderOK;

    });


    /*
       ترتيب الأقسام من الأقرب إلى معدلك
    */

    matches.sort((a, b) =>
        Number(b.minimum) - Number(a.minimum)
    );


    summary.classList.remove("hidden");

    summary.innerHTML = `
        <strong>معدلك:</strong> ${grade.toFixed(2)}
        &nbsp; | &nbsp;
        <strong>الفرع:</strong> ${branch}
        &nbsp; | &nbsp;
        <strong>النتائج:</strong> ${matches.length}
    `;


    results.innerHTML = "";


    if (matches.length === 0) {

        results.innerHTML = `
            <div class="no-results">
                ❌ لم نجد أقساماً مطابقة لمعدلك
                حسب بيانات 2025-2026.
            </div>
        `;

        return;
    }


    matches.forEach(item => {

        const difference =
            grade - Number(item.minimum);


        const card =
            document.createElement("div");

        card.className = "card";


        card.innerHTML = `

            <h2>${escapeHTML(item.department)}</h2>

            <p>
                🎓 <b>الجامعة:</b>
                ${escapeHTML(item.university)}
            </p>

            <p>
                🏛️ <b>الكلية:</b>
                ${escapeHTML(item.college)}
            </p>

            <p>
                📚 <b>الفرع:</b>
                ${escapeHTML(item.branch)}
            </p>

            <p>
                👤 <b>الجنس:</b>
                ${escapeHTML(item.gender)}
            </p>

            <div class="minimum">
                الحد الأدنى:
                ${Number(item.minimum).toFixed(2)}
            </div>

            <div class="difference">
                معدلك أعلى من الحد بـ
                ${difference.toFixed(2)}
                درجة
            </div>

        `;


        results.appendChild(card);

    });

}


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
